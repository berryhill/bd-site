<svg width="390" height="560" viewBox="0 0 390 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two vertically drawn migration routes separately test old-writer memory with the new reader and new-writer memory with the old reader, while averaging is rejected." style="display:block;width:100%;max-width:100%;height:auto;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><title>Migration direction is two gates, not one average</title><desc>The first route compares inherited old-writer memory with the new reader's own-store baseline. The second compares new-writer memory with the old reader's own-store baseline. Both gates must pass independently.</desc><defs><marker id="mm-gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76f5a4"/></marker></defs><rect width="390" height="560" rx="6" fill="#081018"/><text x="24" y="32" font-size="14" font-weight="600" fill="#76f5a4">DIRECTIONAL ACCEPTANCE</text><text x="24" y="66" font-size="17" font-weight="600" fill="#e8f1f2">Forward cutover</text><rect x="24" y="84" width="342" height="54" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><text x="195" y="105" text-anchor="middle" font-size="16" font-weight="600" fill="#e8f1f2">Old-writer inherited store</text><text x="195" y="131" text-anchor="middle" font-size="16" fill="#b7c7c9">Read with the new reader</text><line x1="195" y1="138" x2="195" y2="160" stroke="#76f5a4" stroke-width="2" marker-end="url(#mm-gate-arrow)"/><text x="218" y="155" font-size="14" font-weight="600" fill="#76f5a4">GATE 1</text><rect x="24" y="166" width="342" height="54" rx="6" fill="#101b24" stroke="#76f5a4" stroke-width="1.5"/><text x="195" y="187" text-anchor="middle" font-size="16" font-weight="600" fill="#e8f1f2">Compare with the new reader's</text><text x="195" y="213" text-anchor="middle" font-size="16" fill="#b7c7c9">own-store baseline</text><text x="24" y="266" font-size="17" font-weight="600" fill="#e8f1f2">Behavioral rollback</text><rect x="24" y="284" width="342" height="54" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><text x="195" y="305" text-anchor="middle" font-size="16" font-weight="600" fill="#e8f1f2">New-writer post-cutover store</text><text x="195" y="331" text-anchor="middle" font-size="16" fill="#b7c7c9">Read with the old reader</text><line x1="195" y1="338" x2="195" y2="360" stroke="#76f5a4" stroke-width="2" marker-end="url(#mm-gate-arrow)"/><text x="218" y="355" font-size="14" font-weight="600" fill="#76f5a4">GATE 2</text><rect x="24" y="366" width="342" height="54" rx="6" fill="#101b24" stroke="#76f5a4" stroke-width="1.5"/><text x="195" y="387" text-anchor="middle" font-size="16" font-weight="600" fill="#e8f1f2">Compare with the old reader's</text><text x="195" y="413" text-anchor="middle" font-size="16" fill="#b7c7c9">own-store baseline</text><rect x="24" y="458" width="342" height="70" rx="6" fill="#101b24" stroke="#f6b76b" stroke-width="1.5"/><text x="58" y="503" font-size="28" font-weight="600" fill="#f6b76b">×</text><text x="92" y="486" font-size="16" font-weight="600" fill="#e8f1f2">No averaging</text><text x="92" y="511" font-size="16" fill="#b7c7c9">Both directions must pass.</text></svg>
