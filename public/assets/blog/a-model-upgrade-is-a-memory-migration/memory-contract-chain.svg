<svg width="390" height="550" viewBox="0 0 390 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A six-stage memory contract connects experience to behavior through writing, storage, retrieval, and reading, followed by embedding-space and resource-limit dependencies." style="display:block;width:100%;max-width:100%;height:auto;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><title>The memory system is a coupled contract</title><desc>Six vertically connected full-width stages show experience, writer, stored representation, retrieval and delivery, reader, and behavior. Two readable dependency boxes below identify embedding space and resource limits as constraints across the chain.</desc><defs><marker id="mm-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76f5a4"/></marker></defs><rect width="390" height="550" rx="6" fill="#081018"/><text x="24" y="32" font-size="14" font-weight="600" fill="#76f5a4">MEMORY CONTRACT</text><g fill="#101b24" stroke="#22333c" stroke-width="1.5"><rect x="24" y="50" width="342" height="44" rx="6"/><rect x="24" y="110" width="342" height="44" rx="6"/><rect x="24" y="170" width="342" height="44" rx="6"/><rect x="24" y="230" width="342" height="44" rx="6"/><rect x="24" y="290" width="342" height="44" rx="6"/><rect x="24" y="350" width="342" height="44" rx="6"/></g><g fill="#e8f1f2" font-size="16" font-weight="600" text-anchor="middle"><text x="195" y="78">Experience</text><text x="195" y="138">Writer</text><text x="195" y="198">Stored representation</text><text x="195" y="258">Retrieval + delivery</text><text x="195" y="318">Reader</text><text x="195" y="378">Behavior</text></g><g stroke="#76f5a4" stroke-width="2" marker-end="url(#mm-chain-arrow)"><line x1="195" y1="94" x2="195" y2="104"/><line x1="195" y1="154" x2="195" y2="164"/><line x1="195" y1="214" x2="195" y2="224"/><line x1="195" y1="274" x2="195" y2="284"/><line x1="195" y1="334" x2="195" y2="344"/></g><text x="24" y="434" font-size="14" font-weight="600" fill="#f6b76b">COUPLED ACROSS THE CHAIN</text><rect x="24" y="450" width="163" height="68" rx="6" fill="#101b24" stroke="#f6b76b" stroke-width="1.5"/><rect x="203" y="450" width="163" height="68" rx="6" fill="#101b24" stroke="#f6b76b" stroke-width="1.5"/><text x="105.5" y="480" text-anchor="middle" font-size="16" font-weight="600" fill="#e8f1f2">Embedding</text><text x="105.5" y="502" text-anchor="middle" font-size="16" fill="#b7c7c9">space</text><text x="284.5" y="480" text-anchor="middle" font-size="16" font-weight="600" fill="#e8f1f2">Resource</text><text x="284.5" y="502" text-anchor="middle" font-size="16" fill="#b7c7c9">limits</text></svg>
