<svg width="390" height="500" viewBox="0 0 390 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An eight-gate migration sequence covers contract inventory, own-store baselines, two directional tests, index rebuild, governed source evidence, predeclared thresholds, and executable rollback." style="display:block;width:100%;max-width:100%;height:auto;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><title>The eight-part Memory Migration Test</title><desc>Matt's operator synthesis appears as eight numbered gates arranged in two columns, ending with executable rollback. Every gate is required before production authority is granted.</desc><rect width="390" height="500" rx="6" fill="#081018"/><text x="24" y="32" font-size="14" font-weight="600" fill="#76f5a4">MATT'S OPERATOR SYNTHESIS</text><text x="24" y="60" font-size="18" font-weight="600" fill="#e8f1f2">Eight gates before cutover</text><g fill="#101b24" stroke="#22333c" stroke-width="1.5"><rect x="24" y="84" width="163" height="72" rx="6"/><rect x="203" y="84" width="163" height="72" rx="6"/><rect x="24" y="172" width="163" height="72" rx="6"/><rect x="203" y="172" width="163" height="72" rx="6"/><rect x="24" y="260" width="163" height="72" rx="6"/><rect x="203" y="260" width="163" height="72" rx="6"/><rect x="24" y="348" width="163" height="72" rx="6"/><rect x="203" y="348" width="163" height="72" rx="6"/></g><g fill="#76f5a4"><rect x="36" y="96" width="28" height="28" rx="6"/><rect x="215" y="96" width="28" height="28" rx="6"/><rect x="36" y="184" width="28" height="28" rx="6"/><rect x="215" y="184" width="28" height="28" rx="6"/><rect x="36" y="272" width="28" height="28" rx="6"/><rect x="215" y="272" width="28" height="28" rx="6"/><rect x="36" y="360" width="28" height="28" rx="6"/><rect x="215" y="360" width="28" height="28" rx="6"/></g><g fill="#081018" font-size="16" font-weight="600" text-anchor="middle"><text x="50" y="116">1</text><text x="229" y="116">2</text><text x="50" y="204">3</text><text x="229" y="204">4</text><text x="50" y="292">5</text><text x="229" y="292">6</text><text x="50" y="380">7</text><text x="229" y="380">8</text></g><g fill="#e8f1f2" font-size="15" font-weight="600"><text x="74" y="113">Inventory</text><text x="74" y="135">the contract</text><text x="253" y="113">Own-store</text><text x="253" y="135">baselines</text><text x="74" y="201">Old → new</text><text x="74" y="223">test</text><text x="253" y="201">New → old</text><text x="253" y="223">test</text><text x="74" y="289">Rebuild the</text><text x="74" y="311">index</text><text x="253" y="289">Govern source</text><text x="253" y="311">evidence</text><text x="74" y="377">Predeclare</text><text x="74" y="399">thresholds</text><text x="253" y="377">Exercise</text><text x="253" y="399">rollback</text></g><path d="M24 456H366" stroke="#76f5a4" stroke-width="2"/><text x="195" y="482" text-anchor="middle" font-size="15" font-weight="600" fill="#76f5a4">All eight pass → production authority</text></svg>
