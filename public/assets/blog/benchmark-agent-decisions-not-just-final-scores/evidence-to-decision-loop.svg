<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">The Evidence-to-Decision Loop</title>
  <desc id="desc">A closed five-stage loop moves from observe to diagnose, intervene, measure, and update, then returns the updated evidence to the next observation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76f5a4"/></marker></defs>
  <rect width="390" height="650" fill="#081018"/>
  <text x="20" y="32" fill="#76f5a4" font-size="14" font-weight="700" letter-spacing="0.7">ITERATIVE EVALUATION</text>
  <text x="20" y="64" fill="#e8f1f2" font-size="20" font-weight="700">Every decision changes the evidence</text>
  <path d="M195 128V156M195 224V252M195 320V348M195 416V444" stroke="#76f5a4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M84 482C26 482 26 112 84 112" fill="none" stroke="#76f5a4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="84" y="88" width="222" height="40" rx="6" fill="#101b24" stroke="#76f5a4" stroke-width="1.5"/>
  <circle cx="108" cy="108" r="14" fill="#76f5a4"/><text x="108" y="114" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">1</text><text x="134" y="114" fill="#e8f1f2" font-size="17" font-weight="700">Observe</text><text x="211" y="114" fill="#7f9297" font-size="14">metrics + logs</text>
  <rect x="84" y="184" width="222" height="40" rx="6" fill="#101b24" stroke="#76f5a4" stroke-width="1.5"/>
  <circle cx="108" cy="204" r="14" fill="#76f5a4"/><text x="108" y="210" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">2</text><text x="134" y="210" fill="#e8f1f2" font-size="17" font-weight="700">Diagnose</text><text x="222" y="210" fill="#7f9297" font-size="14">explain</text>
  <rect x="84" y="280" width="222" height="40" rx="6" fill="#101b24" stroke="#76f5a4" stroke-width="1.5"/>
  <circle cx="108" cy="300" r="14" fill="#76f5a4"/><text x="108" y="306" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">3</text><text x="134" y="306" fill="#e8f1f2" font-size="17" font-weight="700">Intervene</text><text x="225" y="306" fill="#7f9297" font-size="14">test</text>
  <rect x="84" y="376" width="222" height="40" rx="6" fill="#101b24" stroke="#76f5a4" stroke-width="1.5"/>
  <circle cx="108" cy="396" r="14" fill="#76f5a4"/><text x="108" y="402" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">4</text><text x="134" y="402" fill="#e8f1f2" font-size="17" font-weight="700">Measure</text><text x="214" y="402" fill="#7f9297" font-size="14">consequence</text>
  <rect x="84" y="472" width="222" height="40" rx="6" fill="#101b24" stroke="#f6b76b" stroke-width="1.5"/>
  <circle cx="108" cy="492" r="14" fill="#f6b76b"/><text x="108" y="498" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">5</text><text x="134" y="498" fill="#e8f1f2" font-size="17" font-weight="700">Update</text><text x="198" y="498" fill="#7f9297" font-size="14">next move</text>
  <rect x="48" y="546" width="294" height="54" rx="6" fill="#1b2a33" stroke="#22333c" stroke-width="1.5"/>
  <text x="195" y="568" text-anchor="middle" fill="#e8f1f2" font-size="15" font-weight="600">Review the transition, not just the nodes.</text>
  <text x="195" y="589" text-anchor="middle" fill="#7f9297" font-size="14">Did reality change the next decision?</text>
  <text x="20" y="632" fill="#7f9297" font-size="14">A reliable loop changes course after consequences.</text>
</svg>
