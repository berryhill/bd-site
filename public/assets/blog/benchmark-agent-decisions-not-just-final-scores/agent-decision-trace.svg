<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" role="img" aria-labelledby="title desc" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">The Agent Decision Trace</title>
  <desc id="desc">A six-entry operator record preserves context, evidence used, the decision, expected effect, observed consequence, and validity plus budget for each consequential intervention.</desc>
  <rect width="390" height="780" fill="#081018"/>
  <text x="20" y="32" fill="#76f5a4" font-size="14" font-weight="700" letter-spacing="0.7">OPERATOR ARTIFACT</text>
  <text x="20" y="64" fill="#e8f1f2" font-size="24" font-weight="700">The Agent Decision Trace</text>
  <text x="20" y="89" fill="#7f9297" font-size="15">Preserve six entries for every consequential move.</text>
  <g id="context" data-check="1"><rect x="20" y="112" width="350" height="84" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><rect x="36" y="132" width="32" height="32" rx="6" fill="#76f5a4"/><text x="52" y="154" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">1</text><text x="84" y="148" fill="#e8f1f2" font-size="18" font-weight="700">Context</text><text x="84" y="174" fill="#7f9297" font-size="16">State, constraints, attempts, budget</text></g>
  <g id="evidence-used" data-check="2"><rect x="20" y="208" width="350" height="84" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><rect x="36" y="228" width="32" height="32" rx="6" fill="#76f5a4"/><text x="52" y="250" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">2</text><text x="84" y="244" fill="#e8f1f2" font-size="18" font-weight="700">Evidence used</text><text x="84" y="270" fill="#7f9297" font-size="16">Metrics, logs, errors, comparisons</text></g>
  <g id="decision" data-check="3"><rect x="20" y="304" width="350" height="84" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><rect x="36" y="324" width="32" height="32" rx="6" fill="#76f5a4"/><text x="52" y="346" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">3</text><text x="84" y="340" fill="#e8f1f2" font-size="18" font-weight="700">Decision</text><text x="84" y="366" fill="#7f9297" font-size="16">Diagnosis and selected intervention</text></g>
  <g id="expected-effect" data-check="4"><rect x="20" y="400" width="350" height="84" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><rect x="36" y="420" width="32" height="32" rx="6" fill="#76f5a4"/><text x="52" y="442" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">4</text><text x="84" y="436" fill="#e8f1f2" font-size="18" font-weight="700">Expected effect</text><text x="84" y="462" fill="#7f9297" font-size="16">Prediction and testable reason</text></g>
  <g id="observed-consequence" data-check="5"><rect x="20" y="496" width="350" height="84" rx="6" fill="#101b24" stroke="#22333c" stroke-width="1.5"/><rect x="36" y="516" width="32" height="32" rx="6" fill="#f6b76b"/><text x="52" y="538" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">5</text><text x="84" y="532" fill="#e8f1f2" font-size="18" font-weight="700">Observed consequence</text><text x="84" y="558" fill="#7f9297" font-size="16">Result, failure, side effect, ambiguity</text></g>
  <g id="validity-and-budget" data-check="6"><rect x="20" y="592" width="350" height="84" rx="6" fill="#101b24" stroke="#f6b76b" stroke-width="1.5"/><rect x="36" y="612" width="32" height="32" rx="6" fill="#f6b76b"/><text x="52" y="634" text-anchor="middle" fill="#081018" font-size="16" font-weight="700">6</text><text x="84" y="628" fill="#e8f1f2" font-size="18" font-weight="700">Validity and budget</text><text x="84" y="654" fill="#7f9297" font-size="16">Executable? Cost and budget effect</text></g>
  <rect x="20" y="700" width="350" height="48" rx="6" fill="#1b2a33"/>
  <text x="195" y="720" text-anchor="middle" fill="#e8f1f2" font-size="15" font-weight="600">Compare expectation with consequence.</text>
  <text x="195" y="740" text-anchor="middle" fill="#7f9297" font-size="14">Then verify the next move actually updated.</text>
  <text x="195" y="762" text-anchor="middle" fill="#7f9297" font-size="14">Review the choice without retaining private tokens.</text>
</svg>
