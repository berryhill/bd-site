<svg xmlns="http://www.w3.org/2000/svg" width="390" height="940" viewBox="0 0 390 940" role="img" aria-labelledby="promotion-gate-title promotion-gate-desc" data-diagram-form="numbered-decision-rail">
  <title id="promotion-gate-title">Verification Promotion Gate</title>
  <desc id="promotion-gate-desc">A numbered vertical gate contains eight stages: disputed claim, evidence class, computational intent, tool authority, evidence receipt, adjudication, regression check, and fallback. Promotion is allowed only when evidence is relevant, adjudication explicitly approves promotion, and regression checks pass.</desc>
  <defs>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#800020"/></marker>
  </defs>
  <rect width="390" height="940" fill="#fffbeb"/>
  <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1c1917">Verification Promotion Gate</text>
  <text x="20" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Eight stages before a correction may act</text>

  <g id="eight-stage-gate">
    <line x1="39" y1="112" x2="39" y2="668" stroke="#800020" stroke-width="1.5"/>

    <g id="stage-disputed-claim"><rect x="20" y="88" width="350" height="62" rx="6" fill="#fffbeb" stroke="#800020" stroke-width="1.5"/><rect x="24" y="104" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="125" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">1</text><text x="70" y="114" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Disputed claim</text><text x="70" y="137" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Name the exact proposition that changed.</text></g>
    <g id="stage-evidence-class"><rect x="20" y="158" width="350" height="62" rx="6" fill="#fef3c7" stroke="#800020" stroke-width="1.5"/><rect x="24" y="174" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="195" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">2</text><text x="70" y="184" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Evidence class</text><text x="70" y="207" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Executable, inspectable, or human.</text></g>
    <g id="stage-computational-intent"><rect x="20" y="228" width="350" height="62" rx="6" fill="#fffbeb" stroke="#800020" stroke-width="1.5"/><rect x="24" y="244" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="265" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">3</text><text x="70" y="254" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Computational intent</text><text x="70" y="277" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Define what the check must establish.</text></g>
    <g id="stage-tool-authority"><rect x="20" y="298" width="350" height="62" rx="6" fill="#fef3c7" stroke="#800020" stroke-width="1.5"/><rect x="24" y="314" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="335" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">4</text><text x="70" y="324" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Tool authority</text><text x="70" y="347" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Bound inputs, permissions, and effects.</text></g>
    <g id="stage-evidence-receipt"><rect x="20" y="368" width="350" height="62" rx="6" fill="#fffbeb" stroke="#800020" stroke-width="1.5"/><rect x="24" y="384" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="405" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">5</text><text x="70" y="394" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Evidence receipt</text><text x="70" y="417" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Record what ran, returned, and when.</text></g>
    <g id="stage-adjudication"><rect x="20" y="438" width="350" height="62" rx="6" fill="#fef3c7" stroke="#800020" stroke-width="1.5"/><rect x="24" y="454" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="475" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">6</text><text x="70" y="464" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Adjudication</text><text x="70" y="487" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Promote, revise, refuse, or escalate.</text></g>
    <g id="stage-regression-check"><rect x="20" y="508" width="350" height="62" rx="6" fill="#fffbeb" stroke="#800020" stroke-width="1.5"/><rect x="24" y="524" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="545" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">7</text><text x="70" y="534" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Regression check</text><text x="70" y="557" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Protect prior known-good behavior.</text></g>
    <g id="stage-fallback"><rect x="20" y="578" width="350" height="62" rx="6" fill="#fef3c7" stroke="#800020" stroke-width="1.5"/><rect x="24" y="594" width="30" height="30" rx="6" fill="#800020"/><text x="39" y="615" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fffbeb">8</text><text x="70" y="604" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1917">Fallback</text><text x="70" y="627" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Predeclare the safe non-promotion path.</text></g>
  </g>

  <line x1="195" y1="640" x2="195" y2="674" stroke="#800020" stroke-width="1.5" marker-end="url(#gate-arrow)"/>
  <g id="promotion-decision-rail">
    <rect x="20" y="682" width="350" height="160" rx="6" fill="#800020"/>
    <text x="195" y="713" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fffbeb">PROMOTION DECISION</text>
    <text x="40" y="746" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fffbeb">✓ Relevant evidence exists</text>
    <text x="40" y="775" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fffbeb">✓ Adjudication explicitly says promote</text>
    <text x="40" y="804" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fffbeb">✓ Regression check passes</text>
    <text x="195" y="830" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fef3c7">ALL THREE → PROMOTE</text>
  </g>
  <g id="non-promotion-outcome">
    <rect x="20" y="858" width="350" height="58" rx="6" fill="#fef3c7" stroke="#800020" stroke-width="1.5"/>
    <text x="195" y="883" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#800020">ANY FAILURE → DO NOT PROMOTE</text>
    <text x="195" y="905" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#57534e">Retain • revise • defer • escalate • refuse</text>
  </g>
</svg>
