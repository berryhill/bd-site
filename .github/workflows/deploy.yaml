name: bd-site

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  packages: write

env:
  NAME: bd-site
  DOCKER_REGISTRY: ghcr.io
  DOCKER_ORG: berryhill
  # Publish through this repository's GITHUB_TOKEN. The legacy `bd-site`
  # package was created outside this workflow and does not grant this repo
  # Actions write access.
  DOCKER_IMAGE: bd-site-app
  LINODE_KUBECONFIG: ${{ secrets.LINODE_KUBECONFIG }}
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN}}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.image_tag }}
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "GITHUB_SHA is required for main deployments" >&2
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Building ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}"

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ steps.image.outputs.image_tag }}"
          docker build \
            --build-arg DOT_ENV="${{ secrets.DOT_ENV }}" \
            -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.DOCKER_IMAGE }}:${IMAGE_TAG} .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.LINODE_KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Deploy using Helm
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image-tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "build-push image-tag output is required for deployment" >&2
            exit 1
          fi
          if [ "${IMAGE_TAG}" != "${GITHUB_SHA}" ]; then
            echo "Image tag ${IMAGE_TAG} does not match GitHub revision ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "Deploying ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.DOCKER_IMAGE }}:${IMAGE_TAG} with revision ${GITHUB_SHA}"
          helm upgrade --install bd-site ./helm -f ./helm/values.yaml --install --set dopplerToken="${{ env.DOPPLER_TOKEN }}" --set image.tag="${IMAGE_TAG}" --set deploymentRevision="${GITHUB_SHA}"
          set +e
          kubectl rollout status deployment/bd-site --timeout=180s
          ROLLOUT_STATUS=$?
          set -e

          if [ "${ROLLOUT_STATUS}" -ne 0 ]; then
            echo "Deployment rollout failed with status ${ROLLOUT_STATUS}; collecting bounded diagnostics" >&2
            NAMESPACE="$(kubectl get deployment bd-site -o jsonpath='{.metadata.namespace}' 2>/dev/null || true)"
            NAMESPACE="${NAMESPACE:-default}"

            kubectl get pods -n "${NAMESPACE}" -l app=bd-site -o wide || true
            kubectl get pods -n "${NAMESPACE}" -l app=bd-site -o name 2>/dev/null |
              while IFS= read -r POD_NAME; do
                [ -n "${POD_NAME}" ] || continue
                kubectl describe -n "${NAMESPACE}" "${POD_NAME}" || true
                kubectl logs -n "${NAMESPACE}" "${POD_NAME}" --all-containers=true --tail=120 || true
                kubectl logs -n "${NAMESPACE}" "${POD_NAME}" --all-containers=true --previous --tail=120 || true
              done
            kubectl get events -n "${NAMESPACE}" --field-selector involvedObject.kind=Pod --sort-by=.metadata.creationTimestamp |
              tail -n 80 || true
            exit "${ROLLOUT_STATUS}"
          fi

          kubectl get pods -l app=bd-site -o wide
          curl -fsS https://berryhill.dev/posts/ >/dev/null || true
          kubectl logs deployment/bd-site --tail=120

      - name: Deployment diagnostics
        if: always()
        run: |
          kubectl get deployment bd-site -o wide || true
          kubectl get pods -l app=bd-site -o wide || true
          kubectl get events --field-selector involvedObject.kind=Pod --sort-by=.lastTimestamp | tail -n 60 || true
          kubectl logs deployment/bd-site --tail=120 || true
