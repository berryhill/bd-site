replicaCount: 1

image:
  # bd-site-app is public. Do not attach stale registry credentials to pods;
  # Kubernetes must use GHCR's anonymous pull path.
  repository: ghcr.io/berryhill/bd-site-app
  tag: 0.0.56
  pullPolicy: IfNotPresent

deploymentRevision: ""

service:
  name: bd-site
  type: ClusterIP
  port: 80
  targetPort: 80

command: []
commandArgs: []

ingress:
  host: berryhill.dev
  name: bd-site

dopplerToken: ""

volumes:
  postsContent:
    enabled: true
    pvcName: bd-site-posts-pvc
    size: 25Gi
    storageClassName: ""  # Use default storage class
    accessMode: ReadWriteOnce  # Linode Block Storage only supports ReadWriteOnce
