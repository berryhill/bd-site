replicaCount: 1

image:
  repository: ghcr.io/berryhill/bd-site-app
  tag: 0.0.56
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: bd-site

imagePullSecret:
  name: ghcr-pull

deploymentRevision: ""

service:
  name: bd-site
  type: ClusterIP
  port: 80
  targetPort: 80

command: []
commandArgs: []

ingress:
  host: berryhill.dev
  name: bd-site

dopplerToken: ""

contentStorage:
  filesystem:
    pvc:
      # Creation and mounting are independent so object-mode preparation can
      # retain the rollback claim without attaching it to the application pod.
      create: true
      mount: true
      existingClaim: bd-site-posts-pvc
      preserveOnDelete: true
      size: 25Gi
      storageClassName: ""  # Use default storage class
      accessMode: ReadWriteOnce  # Linode Block Storage only supports ReadWriteOnce
