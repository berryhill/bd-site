# Alternative deployment strategy if ReadWriteMany is not available
# Replace deployment.yaml with this content to use Recreate strategy

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate  # Terminates old pod BEFORE creating new one
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
    spec:
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.command }}
          args: {{ toJson .Values.commandArgs }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: DOPPLER_TOKEN
              value: {{ .Values.dopplerToken }}
          {{- if .Values.contentStorage.filesystem.pvc.mount }}
          volumeMounts:
            - name: posts-content
              mountPath: /app/src/data/blog
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      {{- if .Values.contentStorage.filesystem.pvc.mount }}
      volumes:
        - name: posts-content
          persistentVolumeClaim:
            claimName: {{ .Values.contentStorage.filesystem.pvc.existingClaim }}
      {{- end }}
