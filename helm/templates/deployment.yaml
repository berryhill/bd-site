apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # A single ReadWriteOnce posts volume cannot safely support overlapping
    # old/new pods when Kubernetes schedules them on different nodes.
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      annotations:
        berryhill.dev/deployment-revision: {{ .Values.deploymentRevision | default .Values.image.tag | quote }}
      labels:
        app: {{ .Values.service.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.command }}
          args: {{ toJson .Values.commandArgs }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: DOPPLER_TOKEN
              value: {{ .Values.dopplerToken | quote }}
          volumeMounts:
            - name: posts-content
              mountPath: /app/src/data/blog
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: posts-content
          {{- if .Values.volumes.postsContent.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.volumes.postsContent.pvcName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
